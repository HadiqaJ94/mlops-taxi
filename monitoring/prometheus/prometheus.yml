global:
  scrape_interval: 5s        # demo value; production would use 15s to 60s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: taxi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]     # one uvicorn worker: one process, one set of metrics
