stages:
  download:
    cmd: uv run python -m src.data.download
    deps:
      - src/data/download.py
    params:
      - data.base_url
      - data.reference_months
      - data.drift_months
    outs:
      - data/raw

  preprocess:
    cmd: uv run python -m src.data.preprocess
    deps:
      - src/data/preprocess.py
      - data/raw
    params:
      - data
    outs:
      - data/processed/demand.parquet
      - data/processed/zones.json
      - data/processed/quality_report.json

  validate:                # T4: stops the pipeline (exit 1) if demand.parquet breaks a rule
    cmd: uv run python -m src.data.validate
    deps:
      - src/data/validate.py
      - data/processed/demand.parquet
      - data/processed/zones.json
    params:
      - data
      - validate
    outs:
      - data/processed/validation_report.json

  train:
    cmd: uv run python -m src.train
    deps:
      - data/processed/validation_report.json   # train only runs after validate passed
      - src/train.py
      - src/features.py
      - src/registry.py
      - data/processed/demand.parquet
    params:
      - features
      - train
      - mlflow
      - gate.val_start          # train.py validates on the gate's fixed window
      - gate.val_end
    # The gate itself (src/gate.py) is NOT a stage: it reads and moves aliases in the MLflow
    # registry, state DVC cannot hash. Run it after repro: uv run python -m src.gate
    metrics:
      - metrics.json:
          cache: false
