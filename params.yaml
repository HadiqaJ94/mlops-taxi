data:
  base_url: https://d37ci6vzurychx.cloudfront.net/trip-data/
  reference_months: ["2020-01", "2020-02"]   # what the model is trained on
  drift_months: ["2020-03", "2020-04", "2020-05", "2020-06"]   # COVID collapse
  min_zone_id: 1
  max_zone_id: 263        # 264/265 are "unknown" zones
  top_zones: 50           # busiest zones in the reference period

features:
  lags: [1, 2, 3, 24, 168]   # hours

train:
  val_days: 14               # last N days of the reference period = validation
  loss: poisson              # counts >= 0
  max_iter: 300
  learning_rate: 0.1
  max_depth: 8
  random_state: 42

gate:                        # src/gate.py (T6): candidate vs champion vs baseline on a FIXED window
  # = the last train.val_days (14) days of the reference period, the window train.py has always
  # validated on (tests/test_gate.py checks they stay equal). end is excluded.
  val_start: "2020-02-16"
  val_end: "2020-03-01"
  min_improvement: 0.01      # candidate WAPE must be >= 1% (relative) below the champion's

retrain:                     # src/retrain.py (T16): retrain on recent weeks when drift is found
  as_of: null                # end of the recent windows, excluded (null = end of the data)
  train_weeks: 8             # training window: the 8 weeks just before validation
  val_weeks: 1               # validation (and drift check) window: the last week before as_of

mlflow:
  experiment: nyc-taxi-demand
  registered_model: taxi-demand-forecaster

drift:                      # src/drift.py (T11); not used by the DVC stages
  bins: 10                  # reference deciles
  psi_watch: 0.1            # session 5 rule of thumb: < 0.1 stable, 0.1-0.25 watch
  psi_act: 0.25             # >= 0.25 act
  wape_ratio_max: 1.5       # weekly WAPE above 1.5x the validation WAPE = performance drift
  features: [lag_1, lag_24, lag_168, mean_fare, mean_distance]   # fare/distance: monitoring-only columns

validate:                   # src/data/validate.py (T4)
  max_outlier_share: 0.01   # real TLC files have ~0.006% absurd values; a broken column has far more
  fare_range: [0, 200]      # mean_fare per zone and hour, USD
  distance_range: [0, 100]  # mean_distance per zone and hour, miles
