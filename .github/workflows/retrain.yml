name: retrain

# Workflow 4 (T17): weekly drift check -> retrain on recent weeks -> training gate.
# Same constraints as train.yml: SQLite registry on the runner (ephemeral), data rebuilt with
# dvc repro. The runner starts with an empty registry, so it first trains and gates the
# reference model: that is the champion the drift check and the retrained candidate face.
# Scheduled runs only fire on the default branch (master).

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if no drift is found"
        required: false
        default: false
        type: boolean
      as_of:
        description: "End of the recent windows, YYYY-MM-DD (empty = end of the data)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never kill a training run halfway

env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db   # same default as src/registry.py
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked

      - name: Cache key for the raw TLC files
        id: raw-key
        run: |
          key=$(uv run python -c 'import hashlib, json, yaml; d = yaml.safe_load(open("params.yaml"))["data"]; p = {k: d[k] for k in ("base_url", "reference_months", "drift_months")}; print(hashlib.sha256(json.dumps(p, sort_keys=True).encode()).hexdigest()[:16])')
          echo "key=tlc-raw-${key}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw
          key: ${{ steps.raw-key.outputs.key }}-${{ hashFiles('src/data/download.py') }}

      - name: Data pipeline (download, preprocess, validate)
        run: uv run dvc repro validate
      - name: Reference model -> champion (empty registry on the runner)
        run: |
          uv run dvc repro --force --single-item train
          uv run python -m src.gate

      - name: Drift check, retrain, gate
        # src.retrain runs src.drift itself: drift.py exits 1 on drift, retrain.py reads the
        # report and exits 0 (no retrain / promoted / rejected), so drift never fails the job.
        env:
          FORCE: ${{ inputs.force }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$AS_OF" ]; then args+=(--as-of "$AS_OF"); fi
          uv run python -m src.retrain "${args[@]}"
      - name: Registry state
        if: always()
        run: uv run python -m src.registry status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: retrain-reports
          path: |
            reports/drift_report.json
            reports/retrain_report.json
            reports/gate_report.json
            metrics.json
          if-no-files-found: warn
          retention-days: 30
