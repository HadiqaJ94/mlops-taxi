name: train

# Workflow 2 (T17): rebuild the data, train a candidate, run the training gate.
# No team MLflow server and no DVC remote on a GitHub runner, so:
# - the registry is a SQLite file on the runner (ephemeral: it proves the pipeline is
#   reproducible; real promotions happen against the team's MLflow server);
# - the data is rebuilt from the TLC files (dvc repro), with the raw files cached between runs.

on:
  workflow_dispatch:
    inputs:
      min_improvement:
        description: "Relative WAPE gain the candidate needs over the champion (empty = params.yaml)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never kill a training run halfway

env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db   # same default as src/registry.py
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked

      - name: Cache key for the raw TLC files
        id: raw-key
        # only the params of the download stage (dvc.yaml) decide which files are fetched
        run: |
          key=$(uv run python -c 'import hashlib, json, yaml; d = yaml.safe_load(open("params.yaml"))["data"]; p = {k: d[k] for k in ("base_url", "reference_months", "drift_months")}; print(hashlib.sha256(json.dumps(p, sort_keys=True).encode()).hexdigest()[:16])')
          echo "key=tlc-raw-${key}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/raw
          key: ${{ steps.raw-key.outputs.key }}-${{ hashFiles('src/data/download.py') }}

      - name: Data pipeline (download, preprocess, validate)
        run: uv run dvc repro validate
      - name: Train (registers @candidate)
        # forced: the rebuilt data matches dvc.lock, so a plain repro would skip training
        run: uv run dvc repro --force --single-item train
      - name: Training gate
        env:
          MIN_IMPROVEMENT: ${{ inputs.min_improvement }}
        run: uv run python -m src.gate ${MIN_IMPROVEMENT:+--min-improvement "$MIN_IMPROVEMENT"}
      - name: Registry state
        if: always()
        run: uv run python -m src.registry status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: train-reports
          path: |
            metrics.json
            reports/*.json
            data/processed/quality_report.json
            data/processed/validation_report.json
          if-no-files-found: warn
          retention-days: 30
