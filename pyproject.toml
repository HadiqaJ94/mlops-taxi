[project]
name = "mlops-taxi"
version = "0.1.0"
description = "NYC taxi demand forecasting: a production ML system (MLflow, DVC, FastAPI, monitoring)"
readme = "README.md"
authors = [
    { name = "Hadiqa94", email = "hadilakk2443837@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "locust>=2.47.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.extra-build-variables]
# PyYAML has no Windows wheel for Python 3.15, so uv builds it from source. Its optional
# C extension needs Microsoft C++ Build Tools; the pure-Python build needs nothing.
pyyaml = { PYYAML_FORCE_LIBYAML = "0", PYYAML_FORCE_CYTHON = "0" }
