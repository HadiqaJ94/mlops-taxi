[project]
name = "mlops-taxi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hadiqa94", email = "hadilakk2443837@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mlops-taxi = "mlops_taxi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "locust>=2.47.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
